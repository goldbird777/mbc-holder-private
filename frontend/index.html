<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBC 블록체인 탐색기</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0e27; color: #fff; }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #00d4ff, #0099cc); padding: 30px; border-radius: 10px; margin-bottom: 20px; }
        h1 { font-size: 32px; margin-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-top: 15px; }
        .stat-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 5px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-bottom: 8px; }
        .search-box { background: #1a1f3a; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px; background: #0a0e27; border: 2px solid #00d4ff; border-radius: 5px; color: #fff; font-size: 14px; font-family: monospace; }
        .search-box button { padding: 12px 30px; background: #00d4ff; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        button { padding: 10px 20px; background: #00d4ff; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00a8cc; }
        table { width: 100%; border-collapse: collapse; background: #1a1f3a; border-radius: 5px; overflow: hidden; font-size: 13px; }
        th { background: #0099cc; padding: 12px 10px; text-align: left; font-weight: bold; }
        td { padding: 10px; border-bottom: 1px solid #2a2f4a; word-break: break-all; }
        tr:hover { background: #2a2f4a; }
        .address { color: #00d4ff; cursor: pointer; text-decoration: underline; font-family: monospace; font-size: 12px; }
        .token-badge { background: #4ade80; color: #000; padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .pagination { display: flex; gap: 5px; margin-top: 20px; justify-content: center; flex-wrap: wrap; }
        .pagination button { padding: 8px 12px; min-width: 40px; font-size: 12px; }
        .pagination button.active { background: #00a8cc; }
        .detail-page { display: none; }
        .detail-page.show { display: block; }
        .list-page.hide { display: none; }
        .back-btn { background: #666; margin-bottom: 20px; }
        .back-btn:hover { background: #888; }
        .detail-header { background: #1a1f3a; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #00d4ff; }
        .detail-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-top: 15px; }
        .detail-stat { background: rgba(0,212,255,0.1); padding: 15px; border-radius: 5px; }
        .tabs { display: flex; gap: 0; margin-top: 20px; border-bottom: 2px solid #2a2f4a; }
        .tab { padding: 12px 30px; background: #1a1f3a; color: #999; cursor: pointer; border: none; font-weight: bold; }
        .tab.active { background: #0099cc; color: #fff; border-bottom: 3px solid #00d4ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tx-in { color: #4ade80; font-weight: bold; }
        .tx-out { color: #f87171; font-weight: bold; }
        .self-transfer { color: #f59e0b; font-size: 11px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; color: #888; flex-wrap: wrap; }
        .breadcrumb .bc-link { color: #00d4ff; font-family: monospace; cursor: pointer; }
        .breadcrumb .bc-link:hover { text-decoration: underline; }
        .breadcrumb .bc-sep { color: #555; }
        .breadcrumb .bc-current { color: #fff; font-family: monospace; }
    </style>
</head>
<body>
    <div class="list-page" id="listPage">
        <div class="container">
            <header>
                <h1>&#9889; MicroBitcoin 탐색기</h1>
                <div class="stats">
                    <div class="stat-box"><div class="stat-label">블록</div><div class="stat-value" id="blockHeight">-</div></div>
                    <div class="stat-box"><div class="stat-label">홀더</div><div class="stat-value" id="holderCount">-</div></div>
                    <div class="stat-box"><div class="stat-label">진행률</div><div class="stat-value">100%</div></div>
                    <div class="stat-box"><div class="stat-label">마지막 갱신</div><div style="font-size: 13px;" id="lastUpdate">-</div></div>
                </div>
            </header>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="지갑 주소 입력..." />
                <button onclick="searchAddress()">&#128269; 검색</button>
            </div>
            <div class="controls">
                <button onclick="downloadCSV()">&#128202; CSV</button>
            </div>
            <table>
                <thead><tr><th>#</th><th>주소</th><th>잔액(MBC)</th><th>점유율</th><th>토큰</th></tr></thead>
                <tbody id="tableBody"><tr><td colspan="5">로딩...</td></tr></tbody>
            </table>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div class="detail-page" id="detailPage">
        <div class="container">
            <div class="breadcrumb" id="breadcrumb"></div>
            <button class="back-btn" onclick="goBack()">&#8592; 뒤로</button>
            <div class="detail-header">
                <div style="opacity:0.7; font-size:12px; margin-bottom:8px;">주소</div>
                <div style="font-size: 15px; font-family: monospace; color: #00d4ff; word-break: break-all;" id="detailAddress"></div>
            </div>
            <div class="detail-stats">
                <div class="detail-stat"><div style="opacity:0.7;font-size:12px;">MBC 거래 수</div><div style="font-size:18px;font-weight:bold;" id="detailTxCount">-</div></div>
                <div class="detail-stat"><div style="opacity:0.7;font-size:12px;">보유 잔액</div><div style="font-size:18px;font-weight:bold;color:#00d4ff;" id="detailBalance">-</div></div>
                <div class="detail-stat"><div style="opacity:0.7;font-size:12px;">총 수신</div><div style="font-size:18px;font-weight:bold;color:#4ade80;" id="detailReceived">-</div></div>
                <div class="detail-stat"><div style="opacity:0.7;font-size:12px;">총 송신</div><div style="font-size:18px;font-weight:bold;color:#f87171;" id="detailSent">-</div></div>
                <div class="detail-stat"><div style="opacity:0.7;font-size:12px;">순금액</div><div style="font-size:18px;font-weight:bold;" id="detailNet">-</div></div>
            </div>
            <div class="tabs">
                <button class="tab active" id="tabMbc" onclick="switchTab('mbc', this)">&#128176; MBC 거래</button>
                <button class="tab" id="tabTokens" onclick="switchTab('tokens', this)">&#129689; 레이어2 토큰</button>
            </div>
            <div id="mbcTab" class="tab-content active">
                <table style="margin-top:20px;"><thead><tr><th>From</th><th>To</th><th>거래ID</th><th>수신(MBC)</th><th>송신(MBC)</th><th>순금액(MBC)</th><th>확인수</th><th>시간</th></tr></thead>
                <tbody id="txTableBody"><tr><td colspan="8">로딩...</td></tr></tbody></table>
            </div>
            <div id="tokensTab" class="tab-content">
                <div style="margin-top:20px;" id="tokensContainer">로딩...</div>
            </div>
        </div>
    </div>

    <script>
        var allHolders = [];
        var currentPage = 1;
        var itemsPerPage = 100;

        // 네비게이션 히스토리 스택 - 각 항목: { address, tab }
        var navHistory = [];

        // 토큰 배치 로딩용
        var tokenLoadQueue = [];
        var tokenLoadTimer = null;

        function formatNumber(num) {
            return Number(num).toLocaleString('ko-KR', {minimumFractionDigits: 2, maximumFractionDigits: 8});
        }

        function formatDate(ts) {
            if (!ts) return '-';
            return new Date(ts * 1000).toLocaleString('ko-KR');
        }

        function shortAddr(addr) {
            if (!addr || addr.length < 16) return addr;
            return addr.substring(0, 8) + '...' + addr.substring(addr.length - 6);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ── 브레드크럼 ──────────────────────────────────────────
        function renderBreadcrumb() {
            var bc = document.getElementById('breadcrumb');
            if (navHistory.length <= 1) { bc.innerHTML = ''; return; }
            var html = '<span class="bc-link" onclick="goHome()">목록</span>';
            for (var i = 0; i < navHistory.length; i++) {
                html += '<span class="bc-sep"> › </span>';
                if (i < navHistory.length - 1) {
                    (function(idx) {
                        html += '<span class="bc-link" onclick="jumpHistory(' + idx + ')">' + escapeHtml(shortAddr(navHistory[idx].address)) + '</span>';
                    })(i);
                } else {
                    html += '<span class="bc-current">' + escapeHtml(shortAddr(navHistory[i].address)) + '</span>';
                }
            }
            bc.innerHTML = html;
        }

        function jumpHistory(index) {
            navHistory = navHistory.slice(0, index + 1);
            var target = navHistory[navHistory.length - 1];
            _loadDetail(target.address, target.tab || 'mbc');
        }

        function goHome() {
            navHistory = [];
            showListPage();
        }

        // ── 페이지 전환 ─────────────────────────────────────────
        function showListPage() {
            document.getElementById('listPage').classList.remove('hide');
            document.getElementById('detailPage').classList.remove('show');
            var saved = sessionStorage.getItem('lastPage');
            if (saved) currentPage = parseInt(saved);
            renderPage();
            renderPagination();
            window.scrollTo(0, 0);
        }

        function showDetailPage() {
            document.getElementById('listPage').classList.add('hide');
            document.getElementById('detailPage').classList.add('show');
            window.scrollTo(0, 0);
        }

        // ── 주소 상세 (목록에서 진입) ────────────────────────────
        function showDetail(address) {
            sessionStorage.setItem('lastPage', currentPage);
            // 목록에서 진입 시 히스토리 초기화
            if (!document.getElementById('detailPage').classList.contains('show')) {
                navHistory = [];
            }
            navHistory.push({ address: address, tab: 'mbc' });
            _loadDetail(address, 'mbc');
            showDetailPage();
        }

        // ── 상세에서 다른 주소 클릭 (히스토리 쌓기) ─────────────
        function drillDetail(address) {
            navHistory.push({ address: address, tab: 'mbc' });
            _loadDetail(address, 'mbc');
            window.scrollTo(0, 0);
        }

        // ── 실제 데이터 로드 ────────────────────────────────────
        function _loadDetail(address, defaultTab) {
            // 즉시 로딩 상태 표시
            document.getElementById('detailAddress').textContent = address;
            document.getElementById('detailTxCount').textContent = '-';
            document.getElementById('detailBalance').textContent = '-';
            document.getElementById('detailReceived').textContent = '-';
            document.getElementById('detailSent').textContent = '-';
            document.getElementById('detailNet').textContent = '-';
            document.getElementById('txTableBody').innerHTML = '<tr><td colspan="8">로딩 중...</td></tr>';
            document.getElementById('tokensContainer').innerHTML = '로딩 중...';

            switchTabByName(defaultTab || 'mbc');
            renderBreadcrumb();

            var currentAddr = address; // 클로저용 캡처

            // MBC 거래 로드
            fetch('/api/address/' + address)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    // 다른 주소로 이동한 경우 무시
                    if (document.getElementById('detailAddress').textContent !== currentAddr) return;

                    var holder = allHolders.find(function(h) { return h.address === currentAddr; });
                    document.getElementById('detailTxCount').textContent = data.transactions.length;
                    document.getElementById('detailBalance').textContent = holder
                        ? formatNumber(holder.balance / 100000000) + ' MBC'
                        : '정보 없음';

                    var totalReceived = data.transactions.reduce(function(a,b){ return a + b.received; }, 0);
                    var totalSent     = data.transactions.reduce(function(a,b){ return a + b.sent; },     0);
                    var net = totalReceived - totalSent;

                    document.getElementById('detailReceived').textContent = formatNumber(totalReceived / 10000) + ' MBC';
                    document.getElementById('detailSent').textContent     = formatNumber(totalSent     / 10000) + ' MBC';
                    document.getElementById('detailNet').textContent = (net >= 0 ? '+' : '') + formatNumber(net / 10000) + ' MBC';

                    var rows = data.transactions.slice(0, 100).map(function(tx) {
                        var netAmt = tx.received - tx.sent;
                        var netClass = netAmt >= 0 ? 'tx-in' : 'tx-out';
                        var netStr = (netAmt >= 0 ? '+' : '') + formatNumber(netAmt / 10000);
                        var fromAddr = tx.from || '알수없음';
                        var toAddr   = tx.to   || '알수없음';

                        // From === To 자기 전송 처리
                        var isSelf = (fromAddr === toAddr && fromAddr !== '알수없음' && fromAddr !== 'Coinbase(채굴)');
                        var fromHtml, toHtml;

                        if (isSelf) {
                            fromHtml = '<span class="address" onclick="drillDetail(\'' + escapeHtml(fromAddr) + '\')">' + escapeHtml(fromAddr) + '</span>';
                            toHtml   = '<span class="self-transfer">(자기 전송)</span>';
                        } else {
                            if (fromAddr !== '알수없음' && fromAddr !== 'Coinbase(채굴)') {
                                fromHtml = '<span class="address" onclick="drillDetail(\'' + escapeHtml(fromAddr) + '\')">' + escapeHtml(fromAddr) + '</span>';
                            } else {
                                fromHtml = '<span style="color:#888">' + escapeHtml(fromAddr) + '</span>';
                            }
                            if (toAddr !== '알수없음') {
                                toHtml = '<span class="address" onclick="drillDetail(\'' + escapeHtml(toAddr) + '\')">' + escapeHtml(toAddr) + '</span>';
                            } else {
                                toHtml = '<span style="color:#888">' + escapeHtml(toAddr) + '</span>';
                            }
                        }

                        return '<tr>'
                            + '<td>' + fromHtml + '</td>'
                            + '<td>' + toHtml + '</td>'
                            + '<td style="font-family:monospace;font-size:11px;">' + tx.txid.substring(0, 16) + '...</td>'
                            + '<td class="tx-in">'  + (tx.received > 0 ? formatNumber(tx.received / 10000) : '-') + '</td>'
                            + '<td class="tx-out">' + (tx.sent     > 0 ? formatNumber(tx.sent     / 10000) : '-') + '</td>'
                            + '<td class="' + netClass + '">' + netStr + '</td>'
                            + '<td>' + tx.confirmations + '</td>'
                            + '<td style="font-size:11px;">' + formatDate(tx.time) + '</td>'
                            + '</tr>';
                    }).join('');

                    document.getElementById('txTableBody').innerHTML = rows || '<tr><td colspan="8">거래 없음</td></tr>';
                })
                .catch(function() {
                    if (document.getElementById('detailAddress').textContent === currentAddr) {
                        document.getElementById('txTableBody').innerHTML = '<tr><td colspan="8" style="color:#f87171">데이터 로드 실패</td></tr>';
                    }
                });

            // 토큰 로드
            fetch('/api/tokens/address/' + address)
                .then(function(r) { return r.json(); })
                .then(function(tokenData) {
                    if (document.getElementById('detailAddress').textContent !== currentAddr) return;
                    var balances = (tokenData.balances || []).filter(function(b) { return b.value > 0; });
                    if (balances.length === 0) {
                        document.getElementById('tokensContainer').innerHTML = '<div style="padding:20px;opacity:0.7">토큰 없음</div>';
                    } else {
                        document.getElementById('tokensContainer').innerHTML = balances.map(function(b) {
                            return '<div style="background:#1a1f3a;padding:15px;border-radius:5px;cursor:pointer;margin-bottom:10px" onclick="showTokenTransfers(\'' + escapeHtml(currentAddr) + '\',\'' + escapeHtml(b.ticker) + '\')">'
                                + '<div style="font-weight:bold;margin-bottom:5px">' + escapeHtml(b.ticker) + '</div>'
                                + '<div style="color:#4ade80;font-size:16px">' + formatNumber(b.value / Math.pow(10, b.decimals || 0)) + '</div>'
                                + '</div>';
                        }).join('');
                    }
                })
                .catch(function() {
                    if (document.getElementById('detailAddress').textContent === currentAddr) {
                        document.getElementById('tokensContainer').innerHTML = '<div style="padding:20px;color:#f87171">토큰 로드 실패</div>';
                    }
                });
        }

        // ── 토큰 전송 내역 ──────────────────────────────────────
        function searchTokenTransfers(address, ticker) {
            sessionStorage.setItem('lastPage', currentPage);
            if (!document.getElementById('detailPage').classList.contains('show')) {
                navHistory = [];
                showDetailPage();
            }
            navHistory.push({ address: address, tab: 'tokens' });
            document.getElementById('detailAddress').textContent = address;
            document.getElementById('tokensContainer').innerHTML = '로딩 중...';
            switchTabByName('tokens');
            renderBreadcrumb();
            _fetchTokenTransfers(address, ticker);
        }

        function showTokenTransfers(address, ticker) {
            switchTabByName('tokens');
            document.getElementById('tokensContainer').innerHTML = '로딩 중...';
            _fetchTokenTransfers(address, ticker);
        }

        function _fetchTokenTransfers(address, ticker) {
            fetch('/api/tokens/transfers/' + address + '/' + ticker)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var transfers = data.list || data.transfers || [];
                    if (transfers.length === 0) {
                        document.getElementById('tokensContainer').innerHTML = '<div style="padding:20px;opacity:0.7">' + escapeHtml(ticker) + ' 거래 없음</div>';
                        return;
                    }
                    var rows = transfers.map(function(t) {
                        var from = t.from || t.sender || '';
                        var to   = t.to   || t.receiver || '';
                        return '<tr>'
                            + '<td>&#128260;</td>'
                            + '<td><span class="address" onclick="drillDetail(\'' + escapeHtml(from) + '\')">' + escapeHtml(from.substring(0, 20)) + '...</span></td>'
                            + '<td><span class="address" onclick="drillDetail(\'' + escapeHtml(to)   + '\')">' + escapeHtml(to.substring(0, 20))   + '...</span></td>'
                            + '<td>' + formatNumber((t.amount || t.value) / Math.pow(10, t.decimals || 0)) + ' ' + escapeHtml(ticker) + '</td>'
                            + '<td>' + formatDate(t.time || t.timestamp) + '</td>'
                            + '</tr>';
                    }).join('');
                    document.getElementById('tokensContainer').innerHTML =
                        '<table style="margin-top:20px;width:100%;border-collapse:collapse"><thead><tr><th></th><th>From</th><th>To</th><th>금액</th><th>시간</th></tr></thead><tbody>'
                        + rows + '</tbody></table>';
                })
                .catch(function() {
                    document.getElementById('tokensContainer').innerHTML = '<div style="padding:20px;color:#f87171">토큰 거래 로드 실패</div>';
                });
        }

        // ── 탭 전환 ─────────────────────────────────────────────
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            if (navHistory.length > 0) navHistory[navHistory.length - 1].tab = tabName;
        }

        function switchTabByName(tabName) {
            document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            var id = 'tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1);
            var btn = document.getElementById(id);
            if (btn) btn.classList.add('active');
            var content = document.getElementById(tabName + 'Tab');
            if (content) content.classList.add('active');
        }

        // ── 뒤로가기 ────────────────────────────────────────────
        function goBack() {
            navHistory.pop(); // 현재 제거
            if (navHistory.length > 0) {
                var prev = navHistory[navHistory.length - 1];
                _loadDetail(prev.address, prev.tab || 'mbc');
                window.scrollTo(0, 0);
            } else {
                showListPage();
            }
        }

        // ── 메인 목록 ────────────────────────────────────────────
        function loadData() {
            fetch('/api/holders').then(function(r) { return r.json(); }).then(function(data) {
                allHolders = data.holders || [];
                document.getElementById('holderCount').textContent = (data.count || 0).toLocaleString();
                document.getElementById('blockHeight').textContent = (data.blockHeight || '-').toLocaleString();
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ko-KR');
                // 상세 페이지 보는 중이면 목록 렌더링 건너뜀
                if (!document.getElementById('listPage').classList.contains('hide')) {
                    renderPage();
                    renderPagination();
                }
            });
        }

        // ── 토큰 배치 로딩 ──────────────────────────────────────
        function startTokenBatchLoad(items) {
            if (tokenLoadTimer) clearTimeout(tokenLoadTimer);
            tokenLoadQueue = items.slice();
            tokenLoadTimer = setTimeout(processTokenBatch, 200);
        }

        function processTokenBatch() {
            var batch = tokenLoadQueue.splice(0, 5);
            if (batch.length === 0) return;
            Promise.all(batch.map(function(item) {
                return fetch('/api/tokens/address/' + item.address)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var balances = (data.balances || []).filter(function(b) { return b.value > 0; });
                        var cell = document.getElementById('tcell-' + item.rowIndex);
                        if (!cell) return;
                        if (balances.length > 0) {
                            cell.innerHTML = balances.map(function(b) {
                                return '<span class="token-badge" onclick="searchTokenTransfers(\'' + escapeHtml(item.address) + '\',\'' + escapeHtml(b.ticker) + '\')">' + escapeHtml(b.ticker) + '</span>';
                            }).join(' ');
                        } else {
                            cell.innerHTML = '<span style="color:#555;font-size:11px">-</span>';
                        }
                    })
                    .catch(function() {
                        var cell = document.getElementById('tcell-' + item.rowIndex);
                        if (cell) cell.innerHTML = '<span style="color:#555;font-size:11px">-</span>';
                    });
            })).then(function() {
                if (tokenLoadQueue.length > 0) setTimeout(processTokenBatch, 300);
            });
        }

        function renderPage() {
            var start = (currentPage - 1) * itemsPerPage;
            var pageData = allHolders.slice(start, start + itemsPerPage);
            var totalBalance = allHolders.reduce(function(a,b){ return a + b.balance; }, 0);

            var html = pageData.map(function(h, i) {
                var rowIndex = start + i;
                return '<tr>'
                    + '<td>' + (rowIndex + 1) + '</td>'
                    + '<td><span class="address" onclick="showDetail(\'' + escapeHtml(h.address) + '\')">' + escapeHtml(h.address) + '</span></td>'
                    + '<td>' + formatNumber(h.balance / 100000000) + '</td>'
                    + '<td>' + ((h.balance / totalBalance) * 100).toFixed(4) + '%</td>'
                    + '<td id="tcell-' + rowIndex + '"><span style="color:#555;font-size:11px">...</span></td>'
                    + '</tr>';
            }).join('');

            document.getElementById('tableBody').innerHTML = html;

            // 토큰 배치 로딩 예약
            var queueItems = pageData.map(function(h, i) {
                return { rowIndex: start + i, address: h.address };
            });
            startTokenBatchLoad(queueItems);
        }

        function renderPagination() {
            var maxPages = Math.ceil(allHolders.length / itemsPerPage);
            var p = document.getElementById('pagination');
            p.innerHTML = '';
            if (currentPage > 1) {
                var b = document.createElement('button');
                b.textContent = '⏮ 처음';
                b.onclick = function() { currentPage = 1; renderPage(); renderPagination(); window.scrollTo(0,0); };
                p.appendChild(b);
            }
            var s = Math.max(1, currentPage - 5);
            var e = Math.min(maxPages, s + 9);
            for (var i = s; i <= e; i++) {
                (function(n) {
                    var btn = document.createElement('button');
                    btn.textContent = n;
                    if (n === currentPage) btn.classList.add('active');
                    btn.onclick = function() { currentPage = n; renderPage(); renderPagination(); window.scrollTo(0,0); };
                    p.appendChild(btn);
                })(i);
            }
            if (currentPage < maxPages) {
                var b2 = document.createElement('button');
                b2.textContent = '마지막 ⏭';
                b2.onclick = function() { currentPage = maxPages; renderPage(); renderPagination(); window.scrollTo(0,0); };
                p.appendChild(b2);
            }
            var sp = document.createElement('span');
            sp.style.cssText = 'padding:8px 12px;color:#888;font-size:12px;';
            sp.textContent = currentPage + ' / ' + maxPages;
            p.appendChild(sp);
        }

        function searchAddress() {
            var input = document.getElementById('searchInput').value.trim();
            if (input) showDetail(input);
        }

        function downloadCSV() {
            var totalBalance = allHolders.reduce(function(a,b){ return a + b.balance; }, 0);
            var csv = '순위,주소,잔액(MBC),점유율(%)\n';
            allHolders.forEach(function(h, i) {
                csv += (i+1) + ',"' + h.address + '",' + formatNumber(h.balance/100000000) + ',' + ((h.balance/totalBalance)*100).toFixed(4) + '\n';
            });
            var blob = new Blob(['﻿' + csv], {type: 'text/csv;charset=utf-8;'});
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'MicroBitcoin_Holders.csv';
            link.click();
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') searchAddress(); });
        loadData();
        setInterval(loadData, 300000);
    </script>
</body>
</html>
